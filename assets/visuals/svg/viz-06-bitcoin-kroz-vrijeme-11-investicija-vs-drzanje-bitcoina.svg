<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Investicija mora pobijediti držanje Bitcoina</title>
  <desc id="desc">Dijagram grananja uspoređuje držanje jednog Bitcoina s premještanjem Bitcoina u rizik proizvodne imovine.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 31px; font-weight: 750; }
      .h { font-size: 23px; font-weight: 750; }
      .m { font-size: 19px; font-weight: 650; }
      .s { font-size: 16px; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.4; rx: 8; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
      .green { fill: #eef5ef; stroke: #4d8b68; stroke-width: 2.4; rx: 8; }
      .blue { fill: #edf3fb; stroke: #5b7fb7; stroke-width: 2.4; rx: 8; }
      .muted { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .line { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="640" y="58" text-anchor="middle" class="txt title">Investicija mora pobijediti držanje Bitcoina</text>

  <rect x="520" y="104" width="240" height="76" class="accent"/>
  <text x="640" y="151" text-anchor="middle" class="txt h">1 BTC danas</text>

  <path d="M640 180 C 470 230, 324 264, 252 320" class="line arrow"/>
  <path d="M640 180 C 790 230, 950 264, 1030 320" class="line arrow"/>

  <rect x="100" y="320" width="304" height="96" class="green"/>
  <text x="252" y="358" text-anchor="middle" class="txt h">Držim Bitcoin</text>
  <text x="252" y="390" text-anchor="middle" class="txt s">opcionalnost + vrijeme</text>

  <rect x="876" y="320" width="304" height="96" class="blue"/>
  <text x="1028" y="358" text-anchor="middle" class="txt h">Premještam u rizik</text>
  <text x="1028" y="390" text-anchor="middle" class="txt s">posao, oprema, projekt ili imovina</text>

  <rect x="505" y="260" width="270" height="270" class="muted"/>
  <text x="640" y="304" text-anchor="middle" class="txt h">Rizik traži račun</text>
  <rect x="545" y="336" width="190" height="40" class="box"/>
  <text x="640" y="362" text-anchor="middle" class="txt s">povoljan scenarij</text>
  <rect x="545" y="392" width="190" height="40" class="box"/>
  <text x="640" y="418" text-anchor="middle" class="txt s">nepovoljan scenarij</text>
  <rect x="545" y="448" width="190" height="40" class="box"/>
  <text x="640" y="474" text-anchor="middle" class="txt s">vrijeme i stres</text>

  <path d="M404 368 C 455 368, 485 368, 520 368" class="line arrow"/>
  <path d="M876 368 C 825 368, 795 368, 760 368" class="line arrow"/>

  <rect x="130" y="580" width="1020" height="76" class="accent"/>
  <text x="640" y="614" text-anchor="middle" class="txt m">Završno pitanje</text>
  <text x="640" y="642" text-anchor="middle" class="txt h">Imam li više BTC vrijednosti nego da sam samo držao Bitcoin?</text>

  <path d="M252 416 C 260 500, 360 560, 470 580" class="line arrow"/>
  <path d="M1028 416 C 1020 500, 920 560, 810 580" class="line arrow"/>
  <text x="640" y="710" text-anchor="middle" class="txt s">Povrat u eurima nije dovoljan ako je Bitcoin novčano mjerilo.</text>
</svg>
