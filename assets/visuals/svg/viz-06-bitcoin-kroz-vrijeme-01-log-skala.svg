<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Što radi log skala</title>
  <desc id="desc">Usporedba obične skale i log skale pokazuje da obična skala mjeri jednake dodatke, a log skala jednake omjere.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 30px; font-weight: 750; }
      .h { font-size: 24px; font-weight: 700; }
      .m { font-size: 20px; font-weight: 600; }
      .s { font-size: 17px; }
      .panel { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.4; rx: 8; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
      .line { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .thin { stroke: #9a9a93; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="58" text-anchor="middle" class="txt title">Što radi log skala?</text>

  <rect x="70" y="115" width="500" height="390" class="panel"/>
  <rect x="630" y="115" width="500" height="390" class="panel"/>

  <text x="320" y="165" text-anchor="middle" class="txt h">Obična skala</text>
  <text x="880" y="165" text-anchor="middle" class="txt h">Log skala</text>
  <text x="320" y="202" text-anchor="middle" class="txt s">isti razmak = isti dodatak</text>
  <text x="880" y="202" text-anchor="middle" class="txt s">isti razmak = isti omjer</text>

  <line x1="150" y1="380" x2="490" y2="380" class="line"/>
  <line x1="150" y1="360" x2="150" y2="400" class="thin"/>
  <line x1="263" y1="360" x2="263" y2="400" class="thin"/>
  <line x1="376" y1="360" x2="376" y2="400" class="thin"/>
  <line x1="490" y1="360" x2="490" y2="400" class="thin"/>
  <text x="150" y="430" text-anchor="middle" class="txt m">10</text>
  <text x="263" y="430" text-anchor="middle" class="txt m">20</text>
  <text x="376" y="430" text-anchor="middle" class="txt m">30</text>
  <text x="490" y="430" text-anchor="middle" class="txt m">40</text>
  <text x="320" y="288" text-anchor="middle" class="txt s">+10</text>
  <text x="320" y="318" text-anchor="middle" class="txt s">+10</text>
  <text x="320" y="348" text-anchor="middle" class="txt s">+10</text>

  <line x1="710" y1="380" x2="1050" y2="380" class="line"/>
  <line x1="710" y1="360" x2="710" y2="400" class="thin"/>
  <line x1="823" y1="360" x2="823" y2="400" class="thin"/>
  <line x1="936" y1="360" x2="936" y2="400" class="thin"/>
  <line x1="1050" y1="360" x2="1050" y2="400" class="thin"/>
  <text x="710" y="430" text-anchor="middle" class="txt m">10</text>
  <text x="823" y="430" text-anchor="middle" class="txt m">100</text>
  <text x="936" y="430" text-anchor="middle" class="txt m">1.000</text>
  <text x="1050" y="430" text-anchor="middle" class="txt m">10.000</text>
  <text x="880" y="288" text-anchor="middle" class="txt s">×10</text>
  <text x="880" y="318" text-anchor="middle" class="txt s">×10</text>
  <text x="880" y="348" text-anchor="middle" class="txt s">×10</text>

  <rect x="255" y="540" width="690" height="58" class="accent"/>
  <text x="600" y="575" text-anchor="middle" class="txt m">Log skala ne briše velike razlike. Sabija ih da ih možemo usporediti.</text>
</svg>
