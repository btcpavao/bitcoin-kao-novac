<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Tri skupine neto imovine</title>
  <desc id="desc">Dijagram prikazuje novac, potrošna dobra i proizvodnu imovinu s pravilom trećina.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 28px; font-weight: 700; }
      .large { font-size: 32px; font-weight: 750; }
      .mid { font-size: 22px; font-weight: 650; }
      .small { font-size: 18px; }
      .box { fill: #FFFFFF; stroke: #3A3A3A; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #C9C9C3; stroke-width: 2; }
      .accent { fill: #FFF2E2; stroke: #F7931A; stroke-width: 3; }
      .line { stroke: #3A3A3A; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Tri skupine neto imovine</text>

  <rect x="78" y="118" width="1044" height="398" rx="22" class="soft"/>

  <rect x="128" y="178" width="286" height="268" rx="18" class="accent"/>
  <text x="271" y="246" text-anchor="middle" class="label large">Novac</text>
  <text x="271" y="303" text-anchor="middle" class="label mid">najmanje 1/3</text>
  <line x1="178" y1="332" x2="364" y2="332" class="line"/>
  <text x="271" y="374" text-anchor="middle" class="label small">čekanje</text>
  <text x="271" y="403" text-anchor="middle" class="label small">kupovna moć</text>

  <rect x="457" y="178" width="286" height="268" rx="18" class="box"/>
  <text x="600" y="246" text-anchor="middle" class="label large">Potrošna dobra</text>
  <text x="600" y="303" text-anchor="middle" class="label mid">najviše 1/3</text>
  <line x1="507" y1="332" x2="693" y2="332" class="line"/>
  <text x="600" y="374" text-anchor="middle" class="label small">dom, auto, stvari</text>
  <text x="600" y="403" text-anchor="middle" class="label small">služe životu</text>

  <rect x="786" y="178" width="286" height="268" rx="18" class="box"/>
  <text x="929" y="246" text-anchor="middle" class="label large">Proizvodna</text>
  <text x="929" y="282" text-anchor="middle" class="label large">imovina</text>
  <text x="929" y="337" text-anchor="middle" class="label mid">najviše 1/3</text>
  <line x1="836" y1="362" x2="1022" y2="362" class="line"/>
  <text x="929" y="403" text-anchor="middle" class="label small">stvara vrijednost</text>

  <text x="600" y="568" text-anchor="middle" class="label small">Ravnoteža štiti od bilance u kojoj jedna skupina preuzima cijeli život.</text>
</svg>
