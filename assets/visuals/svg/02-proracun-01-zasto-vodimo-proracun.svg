  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="607.5" y="494">Podaci</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle" x="607.5" y="535">
