  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="267.5" y="494">Namjena</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle" x="267.5" y="535">
    <tspan dy="0" x="267.5">Svaki euro dobiva</tspan>
    <tspan dy="30" x="267.5">posao, a saldo</tspan>
    <tspan dy="30" x="267.5">prestaje biti</tspan>
    <tspan dy="30" x="267.5">jedini vodič.</tspan>
  </text>
