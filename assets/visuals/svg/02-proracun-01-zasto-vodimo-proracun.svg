    <tspan dy="30" x="947.5">dobivaju mjesečnu</tspan>
    <tspan dy="30" x="947.5">pripremu umjesto</tspan>
    <tspan dy="30" x="947.5">iznenađenja.</tspan>
  </text>
  <rect fill="#000000" height="245" opacity="0.14" rx="22" width="305" x="1141" y="403"/>
  <rect fill="#DDD3E8" height="245" rx="22" stroke="#665981" stroke-width="4" width="305" x="1135" y="395"/>
  <circle cx="1287.5" cy="448" fill="#665981" opacity="0.95" r="26"/>
  <text fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="1287.5" y="458">B</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="1287.5" y="504">Bitcoin</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle" x="1287.5" y="545">
    <tspan dy="0" x="1287.5">Kratkoročni novac</tspan>
    <tspan dy="30" x="1287.5">odvaja se od</tspan>
    <tspan dy="30" x="1287.5">dugoročne imovine.</tspan>
  </text>
  <rect fill="#FFF8EA" height="70" rx="22" stroke="#B98A58" stroke-width="2" width="1080" x="260" y="710"/>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" x="800" y="756">manje dojma  +  više stvarnih brojeva  =  bolje odluke</text>
</svg>
