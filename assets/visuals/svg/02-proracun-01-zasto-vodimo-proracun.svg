  <text fill="white" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="947.5" y="448">P</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="947.5" y="494">Planiranje</text>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle" x="947.5" y="535">
