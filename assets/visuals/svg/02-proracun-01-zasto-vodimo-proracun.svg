  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" x="80" y="105">Zašto vodimo proračun?</text>
  <text fill="#66736A" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="start" x="82" y="148">
    <tspan dy="0" x="82">Proračun ne počinje kontrolom potrošnje, nego pitanjem što sadašnji</tspan>
    <tspan dy="28" x="82">novac treba napraviti prije sljedeće uplate.</tspan>
  </text>
  <rect fill="#000000" height="155" opacity="0.14" rx="22" width="650" x="481" y="178"/>
  <rect fill="#FFF8EA" height="155" rx="22" stroke="#B85F2A" stroke-width="4" width="650" x="475" y="170"/>
  <text fill="#23342F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="515" y="220">
    <tspan dy="0" x="515">Što novac koji već imam mora</tspan>
    <tspan dy="34" x="515">napraviti prije nego dođe novi</tspan>
    <tspan dy="34" x="515">novac?</tspan>
  </text>
  <rect fill="#000000" height="245" opacity="0.14" rx="22" width="305" x="121" y="403"/>
  <rect fill="#F7C777" height="245" rx="22" stroke="#B85F2A" stroke-width="4" width="305" x="115" y="395"/>
  <circle cx="267.5" cy="438" fill="#B85F2A" opacity="0.95" r="26"/>
