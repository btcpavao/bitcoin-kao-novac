<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Dug kao zauzeta budućnost</title>
  <desc id="desc">Timeline od šest mjeseci prikazuje da rata duga prva zauzima dio mjesečnog prihoda.</desc>
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 28px; font-weight: 700; }
      .small { font-size: 17px; }
      .mid { font-size: 22px; font-weight: 650; }
      .axis { stroke: #3A3A3A; stroke-width: 2.5; }
      .box { fill: #FFFFFF; stroke: #3A3A3A; stroke-width: 2.5; }
      .debt { fill: #F7931A; stroke: #9B5A10; stroke-width: 1.6; }
      .free { fill: #EFEFED; stroke: #9A9A93; stroke-width: 1.6; }
      .soft { fill: #F6F6F3; stroke: #C9C9C3; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Dug unaprijed zauzima mjesece</text>

  <rect x="78" y="114" width="1044" height="392" rx="22" class="soft"/>
  <line x1="146" y1="398" x2="1054" y2="398" class="axis"/>

  <g class="label small">
    <text x="226" y="445" text-anchor="middle">mjesec 1</text>
    <text x="376" y="445" text-anchor="middle">mjesec 2</text>
    <text x="526" y="445" text-anchor="middle">mjesec 3</text>
    <text x="676" y="445" text-anchor="middle">mjesec 4</text>
    <text x="826" y="445" text-anchor="middle">mjesec 5</text>
    <text x="976" y="445" text-anchor="middle">mjesec 6</text>
  </g>

  <g>
    <rect x="166" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="166" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="166" y="240" width="120" height="148" rx="0" class="free"/>

    <rect x="316" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="316" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="316" y="240" width="120" height="148" rx="0" class="free"/>

    <rect x="466" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="466" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="466" y="240" width="120" height="148" rx="0" class="free"/>

    <rect x="616" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="616" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="616" y="240" width="120" height="148" rx="0" class="free"/>

    <rect x="766" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="766" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="766" y="240" width="120" height="148" rx="0" class="free"/>

    <rect x="916" y="180" width="120" height="208" rx="14" class="box"/>
    <rect x="916" y="180" width="120" height="72" rx="14" class="debt"/>
    <rect x="916" y="240" width="120" height="148" rx="0" class="free"/>
  </g>

  <text x="600" y="154" text-anchor="middle" class="label mid">prvo prošlost, zatim ostatak mjeseca</text>
  <rect x="408" y="532" width="36" height="20" rx="5" class="debt"/>
  <text x="456" y="549" class="label small">rata / dug</text>
  <rect x="626" y="532" width="36" height="20" rx="5" class="free"/>
  <text x="674" y="549" class="label small">slobodan novac</text>
</svg>
