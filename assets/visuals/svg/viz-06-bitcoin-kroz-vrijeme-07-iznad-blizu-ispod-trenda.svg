<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Iznad, blizu i ispod trenda</title>
  <desc id="desc">Dijagram prikazuje tri zone cijene u odnosu na dugoročni trend i zajednički filter osobnog financijskog sustava.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 32px; font-weight: 750; }
      .h { font-size: 23px; font-weight: 750; }
      .m { font-size: 19px; font-weight: 650; }
      .s { font-size: 16px; }
      .xs { font-size: 14px; }
      .panel { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.2; rx: 8; }
      .above { fill: #fff1df; stroke: #f7931a; stroke-width: 2.3; rx: 8; }
      .near { fill: #eef5ef; stroke: #4d8b68; stroke-width: 2.3; rx: 8; }
      .below { fill: #edf3fb; stroke: #5b7fb7; stroke-width: 2.3; rx: 8; }
      .axis { stroke: #333; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .trend { stroke: #333; stroke-width: 4; fill: none; stroke-linecap: round; }
      .price { stroke: #f7931a; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #8f8f89; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .grid { stroke: #deded8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1300" height="760" fill="#fff"/>
  <text x="650" y="56" text-anchor="middle" class="txt title">Iznad, blizu i ispod trenda</text>

  <rect x="64" y="100" width="1172" height="288" class="panel"/>
  <line x1="120" y1="338" x2="1138" y2="338" class="axis"/>
  <line x1="120" y1="338" x2="120" y2="136" class="axis"/>
  <line x1="120" y1="290" x2="1138" y2="290" class="grid"/>
  <line x1="120" y1="242" x2="1138" y2="242" class="grid"/>
  <line x1="120" y1="194" x2="1138" y2="194" class="grid"/>
  <path d="M150 305 C 300 278, 470 247, 650 220 S 985 160, 1110 138" class="trend"/>
  <path d="M150 322 C 225 290, 300 185, 385 216 S 515 292, 610 250 S 760 140, 860 154 S 1000 246, 1110 184" class="price"/>
  <path d="M150 260 C 300 238, 470 207, 650 180 S 985 120, 1110 98" class="dash"/>
  <path d="M150 350 C 300 318, 470 287, 650 260 S 985 200, 1110 178" class="dash"/>
  <text x="1010" y="122" class="txt s">cijena</text>
  <text x="1010" y="154" class="txt s">trend</text>
  <line x1="970" y1="116" x2="1000" y2="116" class="price"/>
  <line x1="970" y1="148" x2="1000" y2="148" class="trend"/>
  <text x="650" y="370" text-anchor="middle" class="txt s">Položaj prema trendu mijenja pitanja, ali ne donosi odluku.</text>

  <rect x="64" y="420" width="365" height="210" class="above"/>
  <rect x="468" y="420" width="365" height="210" class="near"/>
  <rect x="872" y="420" width="365" height="210" class="below"/>

  <text x="246" y="462" text-anchor="middle" class="txt h">Iznad trenda</text>
  <text x="650" y="462" text-anchor="middle" class="txt h">Blizu trenda</text>
  <text x="1054" y="462" text-anchor="middle" class="txt h">Ispod trenda</text>

  <text x="92" y="504" class="txt m">Može značiti:</text>
  <text x="92" y="532" class="txt s">tržište je ispred dugog ritma;</text>
  <text x="92" y="556" class="txt s">vrijeme je za pregled bilance.</text>
  <text x="92" y="592" class="txt m">Ne znači:</text>
  <text x="92" y="620" class="txt s">prodaj sve ili povećaj stil života.</text>

  <text x="496" y="504" class="txt m">Može značiti:</text>
  <text x="496" y="532" class="txt s">obično razdoblje rada, proračuna</text>
  <text x="496" y="556" class="txt s">i kupnje iz stvarnog viška.</text>
  <text x="496" y="592" class="txt m">Ne znači:</text>
  <text x="496" y="620" class="txt s">da je odluka automatski laka.</text>

  <text x="900" y="504" class="txt m">Može značiti:</text>
  <text x="900" y="532" class="txt s">tržište zaostaje za modelom;</text>
  <text x="900" y="556" class="txt s">provjeri postoji li stvarni višak.</text>
  <text x="900" y="592" class="txt m">Ne znači:</text>
  <text x="900" y="620" class="txt s">kupuj sve ili diraj novac za obveze.</text>

  <rect x="140" y="666" width="1020" height="54" class="box"/>
  <text x="650" y="701" text-anchor="middle" class="txt m">Zajednički filter: proračun, nula duga, likvidnost, davanje, ravnoteža, sigurnost i obitelj.</text>
</svg>
