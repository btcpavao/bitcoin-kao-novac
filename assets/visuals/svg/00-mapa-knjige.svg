<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Mapa knjige Bitcoin kao novac</title>
  <desc id="desc">Sekvencijalna mapa knjige: prag, integracija Bitcoina i plodovi kroz vrijeme.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A3A"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .small { font-size: 18px; }
      .medium { font-size: 24px; font-weight: 650; }
      .section { font-size: 20px; font-weight: 700; letter-spacing: 0; }
      .box { fill: #FFFFFF; stroke: #3A3A3A; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #C9C9C3; stroke-width: 2; }
      .accent { fill: #F7931A; stroke: #9B5A10; stroke-width: 2; }
      .line { stroke: #3A3A3A; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="56" text-anchor="middle" class="label medium">Redoslijed provedbe</text>

  <rect x="64" y="110" width="330" height="410" rx="18" class="soft"/>
  <rect x="435" y="110" width="468" height="410" rx="18" class="soft"/>
  <rect x="944" y="110" width="192" height="410" rx="18" class="soft"/>

  <text x="229" y="154" text-anchor="middle" class="label section">Prag</text>
  <text x="669" y="154" text-anchor="middle" class="label section">Integracija Bitcoina</text>
  <text x="1040" y="154" text-anchor="middle" class="label section">Plodovi</text>

  <rect x="98" y="198" width="250" height="58" rx="14" class="box"/>
  <text x="223" y="235" text-anchor="middle" class="label small">Proračun</text>

  <rect x="98" y="302" width="250" height="58" rx="14" class="box"/>
  <text x="223" y="339" text-anchor="middle" class="label small">Dug</text>

  <rect x="98" y="406" width="250" height="58" rx="14" class="box"/>
  <text x="223" y="443" text-anchor="middle" class="label small">Davanje</text>

  <path d="M 223 256 L 223 292" class="line"/>
  <path d="M 223 360 L 223 396" class="line"/>

  <rect x="478" y="198" width="186" height="58" rx="14" class="box"/>
  <text x="571" y="222" text-anchor="middle" class="label small">Ravnoteža</text>
  <text x="571" y="246" text-anchor="middle" class="label small">imovine</text>

  <rect x="693" y="198" width="166" height="58" rx="14" class="accent"/>
  <text x="776" y="222" text-anchor="middle" class="label small">Bitcoin</text>
  <text x="776" y="246" text-anchor="middle" class="label small">kroz vrijeme</text>

  <rect x="566" y="346" width="206" height="58" rx="14" class="box"/>
  <text x="669" y="370" text-anchor="middle" class="label small">Skrbništvo</text>
  <text x="669" y="394" text-anchor="middle" class="label small">i sigurnost</text>

  <path d="M 348 435 C 398 435, 414 227, 468 227" class="line"/>
  <path d="M 664 227 L 683 227" class="line"/>
  <path d="M 776 256 C 776 306, 729 328, 694 342" class="line"/>

  <rect x="973" y="294" width="134" height="92" rx="16" class="box"/>
  <text x="1040" y="326" text-anchor="middle" class="label small">Trideset</text>
  <text x="1040" y="350" text-anchor="middle" class="label small">godina</text>
  <text x="1040" y="374" text-anchor="middle" class="label small">kasnije</text>

  <path d="M 772 375 C 852 375, 879 340, 963 340" class="line"/>

  <text x="229" y="557" text-anchor="middle" class="label small">osnovni red</text>
  <text x="669" y="557" text-anchor="middle" class="label small">Bitcoin ulazi u sustav</text>
  <text x="1040" y="557" text-anchor="middle" class="label small">vrijeme pokazuje plod</text>
</svg>
