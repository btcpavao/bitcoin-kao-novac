<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Power Law u bilježnici</title>
  <desc id="desc">Otvorena matematička bilježnica prikazuje power-law formulu, log oblik formule i mali log-log graf.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 28px; font-weight: 750; }
      .h { font-size: 22px; font-weight: 700; }
      .m { font-size: 20px; font-weight: 650; }
      .s { font-size: 16px; }
      .paper { fill: #fffdf8; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .grid { stroke: #e6e0d4; stroke-width: 1; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.2; rx: 8; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
      .line { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .trend { stroke: #f7931a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .curve { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="58" text-anchor="middle" class="txt title">Power Law u bilježnici</text>
  <rect x="80" y="92" width="1040" height="492" class="paper"/>
  <line x1="600" y1="92" x2="600" y2="584" stroke="#d9d1c3" stroke-width="3"/>
  <g opacity="0.85">
    <path d="M100 132 H580 M100 172 H580 M100 212 H580 M100 252 H580 M100 292 H580 M100 332 H580 M100 372 H580 M100 412 H580 M100 452 H580 M100 492 H580 M100 532 H580" class="grid"/>
    <path d="M620 132 H1100 M620 172 H1100 M620 212 H1100 M620 252 H1100 M620 292 H1100 M620 332 H1100 M620 372 H1100 M620 412 H1100 M620 452 H1100 M620 492 H1100 M620 532 H1100" class="grid"/>
    <path d="M120 112 V564 M160 112 V564 M200 112 V564 M240 112 V564 M280 112 V564 M320 112 V564 M360 112 V564 M400 112 V564 M440 112 V564 M480 112 V564 M520 112 V564 M560 112 V564 M640 112 V564 M680 112 V564 M720 112 V564 M760 112 V564 M800 112 V564 M840 112 V564 M880 112 V564 M920 112 V564 M960 112 V564 M1000 112 V564 M1040 112 V564 M1080 112 V564" class="grid"/>
  </g>

  <text x="130" y="150" class="txt h">1. Formula</text>
  <rect x="130" y="182" width="400" height="74" class="box"/>
  <text x="330" y="228" text-anchor="middle" class="txt m">BTC(h) = 10^a * h^b</text>
  <text x="130" y="304" class="txt h">2. Log oblik</text>
  <rect x="130" y="336" width="400" height="74" class="box"/>
  <text x="330" y="382" text-anchor="middle" class="txt m">log10(BTC) = a + b * log10(h)</text>
  <rect x="130" y="466" width="400" height="52" class="accent"/>
  <text x="330" y="498" text-anchor="middle" class="txt s">okvir za pitanja, ne prognoza</text>

  <text x="650" y="150" class="txt h">3. Što graf radi</text>
  <g transform="translate(660 184)">
    <rect x="0" y="0" width="400" height="310" class="box"/>
    <text x="105" y="42" text-anchor="middle" class="txt s">obični prikaz</text>
    <line x1="45" y1="132" x2="175" y2="132" class="line"/>
    <line x1="45" y1="132" x2="45" y2="42" class="line"/>
    <path d="M 55 126 C 90 123, 124 106, 165 50" class="curve"/>
    <text x="292" y="42" text-anchor="middle" class="txt s">log-log prikaz</text>
    <line x1="230" y1="132" x2="360" y2="132" class="line"/>
    <line x1="230" y1="132" x2="230" y2="42" class="line"/>
    <path d="M 242 118 L 350 58" class="trend"/>
    <path d="M 242 122 L 274 100 L 306 94 L 350 64" class="curve"/>
    <line x1="76" y1="224" x2="156" y2="224" class="line"/>
    <text x="176" y="229" class="txt s">krivulja</text>
    <line x1="76" y1="260" x2="156" y2="260" class="trend"/>
    <text x="176" y="265" class="txt s">ravnija linija</text>
  </g>
  <text x="860" y="548" text-anchor="middle" class="txt s">Formula, ravnanje i trend govore o istoj vezi.</text>
</svg>
