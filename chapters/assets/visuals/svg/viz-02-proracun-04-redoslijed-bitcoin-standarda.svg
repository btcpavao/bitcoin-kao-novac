<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Redoslijed Bitcoin standarda</title>
  <desc id="desc">Dijagram prikazuje redoslijed odluka od proračuna i duga do sigurnosti i ozbiljnijeg Bitcoin standarda.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .mid { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #B9B9B4; stroke-width: 2; }
      .line { stroke: #333333; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="62" text-anchor="middle" class="label title">Redoslijed Bitcoin standarda</text>
  <text x="600" y="101" text-anchor="middle" class="label small">Bitcoin teza ostaje snažna, ali odluke moraju imati redoslijed.</text>

  <rect x="80" y="254" width="150" height="92" rx="10" class="box"/>
  <text x="155" y="308" text-anchor="middle" class="label mid">proračun</text>
  <path d="M 230 300 L 292 300" class="line"/>

  <rect x="310" y="254" width="126" height="92" rx="10" class="box"/>
  <text x="373" y="308" text-anchor="middle" class="label mid">dug</text>
  <path d="M 436 300 L 498 300" class="line"/>

  <rect x="516" y="254" width="142" height="92" rx="10" class="box"/>
  <text x="587" y="308" text-anchor="middle" class="label mid">davanje</text>
  <path d="M 658 300 L 720 300" class="line"/>

  <rect x="738" y="244" width="152" height="112" rx="10" class="box"/>
  <text x="814" y="294" text-anchor="middle" class="label mid">ravnoteža</text>
  <text x="814" y="322" text-anchor="middle" class="label mid">imovine</text>
  <path d="M 890 300 L 952 300" class="line"/>

  <rect x="970" y="254" width="150" height="92" rx="10" class="box"/>
  <text x="1045" y="308" text-anchor="middle" class="label mid">sigurnost</text>

  <path d="M 1045 348 C 1028 448 914 520 820 530" class="line"/>
  <rect x="390" y="474" width="420" height="112" rx="10" class="soft"/>
  <text x="600" y="520" text-anchor="middle" class="label mid">ozbiljniji Bitcoin standard</text>
  <text x="600" y="552" text-anchor="middle" class="label small">dolazi nakon reda, ne umjesto njega</text>
</svg>
