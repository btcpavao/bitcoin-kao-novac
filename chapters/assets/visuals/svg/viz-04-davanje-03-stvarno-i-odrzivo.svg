<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Dobro davanje između dvije krajnosti</title>
  <desc id="desc">Linija prikazuje davanje koje razbija proračun, stvarno i održivo davanje te davanje koje je premalo da traži odluku.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .small { font-size: 17px; }
      .panel { fill: #F7F7F5; stroke: #C9C9C3; stroke-width: 2.5; }
      .zone { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .center { fill: #FFF2E2; stroke: #9B5A10; stroke-width: 3; }
      .line { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Davanje mora biti stvarno, ali održivo</text>
  <rect x="86" y="132" width="1028" height="410" rx="24" class="panel"/>

  <path d="M 188 330 L 1012 330" class="line"/>

  <rect x="126" y="230" width="254" height="176" rx="16" class="zone"/>
  <text x="253" y="276" text-anchor="middle" class="label head">Razbija proračun</text>
  <text x="253" y="321" text-anchor="middle" class="label small">minus</text>
  <text x="253" y="350" text-anchor="middle" class="label small">kartica</text>
  <text x="253" y="379" text-anchor="middle" class="label small">preskočene obveze</text>

  <rect x="456" y="206" width="288" height="224" rx="18" class="center"/>
  <text x="600" y="270" text-anchor="middle" class="label head">Stvarno i održivo</text>
  <text x="600" y="320" text-anchor="middle" class="label small">traži odluku</text>
  <text x="600" y="350" text-anchor="middle" class="label small">ne ruši mir kuće</text>
  <text x="600" y="380" text-anchor="middle" class="label small">može se ponavljati</text>

  <rect x="820" y="230" width="254" height="176" rx="16" class="zone"/>
  <text x="947" y="276" text-anchor="middle" class="label head">Premalo da živi</text>
  <text x="947" y="321" text-anchor="middle" class="label small">samo ideja</text>
  <text x="947" y="350" text-anchor="middle" class="label small">bez transakcije</text>
  <text x="947" y="379" text-anchor="middle" class="label small">bez stvarne odluke</text>

  <text x="600" y="590" text-anchor="middle" class="label small">Nije formula za točan iznos. To je provjera stanja iz kojeg dajete.</text>
</svg>
