<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Budući trošak vraćen u sadašnjost</title>
  <desc id="desc">Shema razlaže trošak od 600 eura za šest mjeseci na šest mjesečnih dijelova po 100 eura.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .mid { font-size: 22px; font-weight: 650; }
      .small { font-size: 18px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #B9B9B4; stroke-width: 2; }
      .line { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tick { stroke: #777777; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="62" text-anchor="middle" class="label title">Budući trošak vraćen u sadašnjost</text>
  <text x="600" y="101" text-anchor="middle" class="label small">Poznati trošak prestaje biti panika kad dobije mjesečni ritam.</text>

  <rect x="92" y="196" width="228" height="150" rx="10" class="box"/>
  <text x="206" y="247" text-anchor="middle" class="label mid">za 6 mjeseci</text>
  <text x="206" y="302" text-anchor="middle" class="label title">600 €</text>

  <path d="M 336 272 L 442 272" class="line"/>
  <text x="389" y="248" text-anchor="middle" class="label small">razlomi</text>

  <rect x="466" y="160" width="636" height="244" rx="12" class="soft"/>
  <text x="784" y="202" text-anchor="middle" class="label mid">šest mjesečnih dijelova</text>

  <g class="label">
    <rect x="512" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="553" y="280" text-anchor="middle" class="small">1.</text>
    <text x="553" y="308" text-anchor="middle" class="mid">100 €</text>
    <rect x="610" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="651" y="280" text-anchor="middle" class="small">2.</text>
    <text x="651" y="308" text-anchor="middle" class="mid">100 €</text>
    <rect x="708" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="749" y="280" text-anchor="middle" class="small">3.</text>
    <text x="749" y="308" text-anchor="middle" class="mid">100 €</text>
    <rect x="806" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="847" y="280" text-anchor="middle" class="small">4.</text>
    <text x="847" y="308" text-anchor="middle" class="mid">100 €</text>
    <rect x="904" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="945" y="280" text-anchor="middle" class="small">5.</text>
    <text x="945" y="308" text-anchor="middle" class="mid">100 €</text>
    <rect x="1002" y="246" width="82" height="78" rx="8" class="box"/>
    <text x="1043" y="280" text-anchor="middle" class="small">6.</text>
    <text x="1043" y="308" text-anchor="middle" class="mid">100 €</text>
  </g>

  <path d="M 512 470 L 1084 470" class="line"/>
  <line x1="512" y1="454" x2="512" y2="486" class="tick"/>
  <line x1="608" y1="454" x2="608" y2="486" class="tick"/>
  <line x1="704" y1="454" x2="704" y2="486" class="tick"/>
  <line x1="800" y1="454" x2="800" y2="486" class="tick"/>
  <line x1="896" y1="454" x2="896" y2="486" class="tick"/>
  <line x1="992" y1="454" x2="992" y2="486" class="tick"/>
  <text x="798" y="530" text-anchor="middle" class="label small">trošak se puni prije nego što postane hitan</text>
</svg>
