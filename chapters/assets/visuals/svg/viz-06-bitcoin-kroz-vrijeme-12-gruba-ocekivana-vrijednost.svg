<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gruba očekivana vrijednost</title>
  <desc id="desc">Bilježnička računica prikazuje povoljan i nepovoljan ishod investicije izražene u Bitcoinu prije poreza, naknada, vremena i stresa.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#e4e1d8" stroke-width="1"/>
    </pattern>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #222; }
      .title { font-size: 32px; font-weight: 750; }
      .h { font-size: 23px; font-weight: 750; }
      .m { font-size: 19px; font-weight: 650; }
      .s { font-size: 16px; }
      .paper { fill: url(#grid); stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .box { fill: #fffefa; stroke: #333; stroke-width: 2.2; rx: 8; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
      .cool { fill: #edf3fb; stroke: #5b7fb7; stroke-width: 2.3; rx: 8; }
      .line { stroke: #333; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="70" y="50" width="1060" height="650" class="paper"/>
  <text x="600" y="106" text-anchor="middle" class="txt title">Gruba očekivana vrijednost</text>
  <text x="600" y="142" text-anchor="middle" class="txt s">Vježba razmišljanja, ne pouzdana statistika.</text>

  <rect x="130" y="190" width="420" height="134" class="box"/>
  <text x="340" y="232" text-anchor="middle" class="txt h">Povoljan ishod</text>
  <text x="340" y="280" text-anchor="middle" class="mono m">80% * 2 BTC = 1,6 BTC</text>

  <rect x="650" y="190" width="420" height="134" class="box"/>
  <text x="860" y="232" text-anchor="middle" class="txt h">Nepovoljan ishod</text>
  <text x="860" y="280" text-anchor="middle" class="mono m">20% * 0,5 BTC = 0,1 BTC</text>

  <path d="M340 324 C 390 384, 470 408, 560 432" class="line arrow"/>
  <path d="M860 324 C 810 384, 730 408, 640 432" class="line arrow"/>

  <rect x="365" y="430" width="470" height="96" class="accent"/>
  <text x="600" y="468" text-anchor="middle" class="txt h">Gruba prosječna slika</text>
  <text x="600" y="502" text-anchor="middle" class="mono m">1,6 BTC + 0,1 BTC = 1,7 BTC</text>

  <rect x="190" y="572" width="820" height="76" class="cool"/>
  <text x="600" y="606" text-anchor="middle" class="txt m">Zatim oduzeti: poreze, naknade, vrijeme, stres i rizik pogrešne procjene.</text>
  <text x="600" y="634" text-anchor="middle" class="txt s">Povoljan scenarij nije cijela računica.</text>
</svg>
