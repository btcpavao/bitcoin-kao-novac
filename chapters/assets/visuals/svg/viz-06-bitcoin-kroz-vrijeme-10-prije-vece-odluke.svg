<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prije veće odluke</title>
  <desc id="desc">Bilježnički obrazac s poljima za datum modela, cijenu, trend, odstupanje, stanje i provjeru koristi li se dug ili novac za obveze.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e4e1d8" stroke-width="1"/>
    </pattern>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 32px; font-weight: 750; }
      .h { font-size: 22px; font-weight: 750; }
      .m { font-size: 19px; font-weight: 650; }
      .s { font-size: 17px; }
      .paper { fill: url(#grid); stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .line { stroke: #333; stroke-width: 2; fill: none; stroke-linecap: round; }
      .soft { stroke: #b8b2a8; stroke-width: 2; fill: none; }
      .box { fill: #fffefa; stroke: #333; stroke-width: 2.2; rx: 8; }
      .stop { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="72" y="54" width="1056" height="648" class="paper"/>
  <text x="600" y="112" text-anchor="middle" class="txt title">Prije veće odluke</text>
  <text x="600" y="150" text-anchor="middle" class="txt s">Jedan model, jedan datum, jedna odluka. Ne biraj model koji opravdava želju.</text>

  <rect x="130" y="192" width="940" height="338" class="box"/>
  <text x="172" y="242" class="txt m">Datum modela:</text>
  <line x1="356" y1="244" x2="670" y2="244" class="line"/>
  <text x="172" y="294" class="txt m">Današnja cijena Bitcoina:</text>
  <line x1="466" y1="296" x2="880" y2="296" class="line"/>
  <text x="172" y="346" class="txt m">Vrijednost trenda na istom modelu:</text>
  <line x1="552" y1="348" x2="940" y2="348" class="line"/>
  <text x="172" y="398" class="txt m">Odstupanje od trenda:</text>
  <line x1="440" y1="400" x2="610" y2="400" class="line"/>
  <text x="630" y="406" class="txt m">%</text>
  <text x="172" y="450" class="txt m">Stanje:</text>
  <rect x="274" y="426" width="28" height="28" class="soft"/>
  <text x="316" y="448" class="txt s">iznad</text>
  <rect x="422" y="426" width="28" height="28" class="soft"/>
  <text x="464" y="448" class="txt s">blizu</text>
  <rect x="548" y="426" width="28" height="28" class="soft"/>
  <text x="590" y="448" class="txt s">ispod</text>
  <text x="172" y="502" class="txt m">Odluka koju razmatram:</text>
  <line x1="466" y1="504" x2="940" y2="504" class="line"/>

  <rect x="130" y="566" width="940" height="86" class="stop"/>
  <text x="172" y="604" class="txt m">Koristim li dug, polugu ili novac za obveze?</text>
  <rect x="766" y="581" width="30" height="30" class="soft"/>
  <text x="810" y="604" class="txt m">da</text>
  <rect x="872" y="581" width="30" height="30" class="soft"/>
  <text x="916" y="604" class="txt m">ne</text>
  <text x="600" y="638" text-anchor="middle" class="txt s">Ako je odgovor "da", odluka se zaustavlja.</text>
</svg>
