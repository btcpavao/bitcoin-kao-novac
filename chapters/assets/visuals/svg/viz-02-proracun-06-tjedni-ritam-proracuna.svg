<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tjedni ritam proračuna</title>
  <desc id="desc">Kružni tok prikazuje pet koraka tjednog održavanja proračuna: usklađivanje računa, unos transakcija, premještanje novca, odluku što se ne kupuje i zapisivanje iznenađenja.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .mid { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.3; }
      .soft { fill: #F6F6F3; stroke: #B9B9B4; stroke-width: 2; }
      .loop { stroke: #333333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="62" text-anchor="middle" class="label title">Tjedni ritam proračuna</text>
  <text x="600" y="101" text-anchor="middle" class="label small">Povjerenje u brojeve nastaje ponavljanjem, ne savršenim planom.</text>

  <circle cx="600" cy="370" r="118" class="soft"/>
  <text x="600" y="358" text-anchor="middle" class="label mid">15-30 min</text>
  <text x="600" y="388" text-anchor="middle" class="label small">jednom tjedno</text>

  <rect x="456" y="148" width="288" height="62" rx="10" class="box"/>
  <text x="600" y="187" text-anchor="middle" class="label mid">uskladi račune</text>
  <rect x="810" y="286" width="272" height="62" rx="10" class="box"/>
  <text x="946" y="325" text-anchor="middle" class="label mid">unesi transakcije</text>
  <rect x="742" y="504" width="286" height="62" rx="10" class="box"/>
  <text x="885" y="543" text-anchor="middle" class="label mid">premjesti novac</text>
  <rect x="172" y="504" width="314" height="62" rx="10" class="box"/>
  <text x="329" y="543" text-anchor="middle" class="label mid">odluči što se ne kupuje</text>
  <rect x="118" y="286" width="300" height="62" rx="10" class="box"/>
  <text x="268" y="325" text-anchor="middle" class="label mid">zapiši iznenađenje</text>

  <path d="M 698 212 C 790 230 852 254 902 282" class="loop"/>
  <path d="M 946 350 C 950 420 924 470 892 500" class="loop"/>
  <path d="M 742 535 C 642 576 536 575 486 544" class="loop"/>
  <path d="M 328 504 C 274 464 252 406 266 350" class="loop"/>
  <path d="M 306 286 C 350 234 410 206 456 190" class="loop"/>
</svg>
