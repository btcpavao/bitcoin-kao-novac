<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">R² je retrovizor</title>
  <desc id="desc">Shema prikazuje R² kao retrovizor koji opisuje prošle log-transformirane podatke, dok budućnost ostaje nepoznata.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 30px; font-weight: 750; }
      .h { font-size: 23px; font-weight: 700; }
      .s { font-size: 16px; }
      .panel { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .mirror { fill: #fff; stroke: #333; stroke-width: 3; rx: 8; }
      .line { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .trend { stroke: #f7931a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .dot { fill: #333; }
      .future { stroke: #8d8d86; stroke-width: 3; fill: none; stroke-dasharray: 8 9; stroke-linecap: round; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="58" text-anchor="middle" class="txt title">R² je retrovizor</text>

  <rect x="82" y="120" width="1036" height="390" class="panel"/>
  <rect x="150" y="172" width="420" height="238" class="mirror"/>
  <text x="360" y="208" text-anchor="middle" class="txt h">prošli podaci</text>
  <text x="360" y="236" text-anchor="middle" class="txt s">log-transformirani</text>
  <path d="M 200 350 L 520 245" class="trend"/>
  <circle cx="220" cy="338" r="7" class="dot"/>
  <circle cx="265" cy="316" r="7" class="dot"/>
  <circle cx="318" cy="302" r="7" class="dot"/>
  <circle cx="366" cy="283" r="7" class="dot"/>
  <circle cx="420" cy="268" r="7" class="dot"/>
  <circle cx="500" cy="248" r="7" class="dot"/>

  <path d="M 580 305 C 690 252, 780 252, 890 305" class="line"/>
  <path d="M 900 305 C 970 350, 1020 395, 1060 460" class="future"/>
  <text x="820" y="244" text-anchor="middle" class="txt h">budućnost</text>
  <text x="985" y="410" text-anchor="middle" class="txt title">?</text>

  <rect x="310" y="535" width="580" height="58" class="accent"/>
  <text x="600" y="570" text-anchor="middle" class="txt s">Dobro uklapanje u prošlosti nije jamstvo budućeg ishoda.</text>
</svg>
