<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Jedna osoba nije sustav</title>
  <desc id="desc">Dijagram uspoređuje krhki Bitcoin sustav u glavi jedne osobe s obiteljskim sustavom uputa, oporavka, prave osobe i testiranja.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A3A"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 28px; font-weight: 700; }
      .mid { font-size: 22px; font-weight: 650; }
      .small { font-size: 18px; }
      .box { fill: #FFFFFF; stroke: #3A3A3A; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #C9C9C3; stroke-width: 2; }
      .accent { fill: #FFF2E2; stroke: #F7931A; stroke-width: 3; }
      .line { stroke: #3A3A3A; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .plainline { stroke: #3A3A3A; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Jedna osoba nije sustav</text>

  <rect x="70" y="118" width="486" height="430" rx="22" class="soft"/>
  <rect x="644" y="118" width="486" height="430" rx="22" class="soft"/>

  <text x="313" y="164" text-anchor="middle" class="label mid">Krhko</text>
  <text x="887" y="164" text-anchor="middle" class="label mid">Sustav</text>

  <circle cx="180" cy="286" r="34" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.5"/>
  <path d="M 130 388 C 138 338, 222 338, 230 388" class="plainline"/>
  <text x="180" y="436" text-anchor="middle" class="label small">jedna osoba</text>

  <path d="M 246 304 L 328 304" class="line"/>
  <rect x="344" y="248" width="144" height="112" rx="16" class="box"/>
  <text x="416" y="292" text-anchor="middle" class="label small">sve znanje</text>
  <text x="416" y="320" text-anchor="middle" class="label small">u glavi</text>

  <path d="M 368 388 L 392 420 L 416 388 L 440 420 L 464 388" fill="none" stroke="#3A3A3A" stroke-width="2.5"/>
  <text x="416" y="462" text-anchor="middle" class="label small">krhkost</text>

  <rect x="694" y="230" width="142" height="70" rx="14" class="box"/>
  <text x="765" y="273" text-anchor="middle" class="label small">Upute</text>

  <rect x="878" y="230" width="142" height="70" rx="14" class="box"/>
  <text x="949" y="273" text-anchor="middle" class="label small">Oporavak</text>

  <rect x="694" y="350" width="142" height="70" rx="14" class="box"/>
  <text x="765" y="378" text-anchor="middle" class="label small">Prava</text>
  <text x="765" y="402" text-anchor="middle" class="label small">osoba</text>

  <rect x="878" y="350" width="142" height="70" rx="14" class="box"/>
  <text x="949" y="393" text-anchor="middle" class="label small">Testiranje</text>

  <path d="M 836 265 L 868 265" class="line"/>
  <path d="M 949 300 L 949 340" class="line"/>
  <path d="M 878 385 L 846 385" class="line"/>
  <path d="M 765 350 L 765 310" class="line"/>

  <rect x="808" y="468" width="158" height="52" rx="16" class="accent"/>
  <text x="887" y="501" text-anchor="middle" class="label small">obiteljski put</text>
  <path d="M 887 420 L 887 458" class="line"/>
</svg>
