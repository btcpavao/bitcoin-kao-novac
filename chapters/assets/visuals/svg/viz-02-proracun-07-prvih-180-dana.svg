<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prvih 180 dana</title>
  <desc id="desc">Vremenska crta prikazuje kako proračun kroz prvi mjesec, tri mjeseca, šest mjeseci i godinu dana postaje sve korisniji.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .mid { font-size: 21px; font-weight: 650; }
      .small { font-size: 17px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.3; }
      .soft { fill: #F6F6F3; stroke: #B9B9B4; stroke-width: 2; }
      .line { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tick { stroke: #333333; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="62" text-anchor="middle" class="label title">Prvih 180 dana</text>
  <text x="600" y="101" text-anchor="middle" class="label small">Proračun postaje pametniji kroz vrijeme jer stvarnost ulazi u kategorije.</text>

  <path d="M 136 344 L 1064 344" class="line"/>
  <line x1="208" y1="310" x2="208" y2="378" class="tick"/>
  <line x1="442" y1="310" x2="442" y2="378" class="tick"/>
  <line x1="676" y1="310" x2="676" y2="378" class="tick"/>
  <line x1="938" y1="310" x2="938" y2="378" class="tick"/>

  <rect x="84" y="174" width="248" height="104" rx="10" class="box"/>
  <text x="208" y="214" text-anchor="middle" class="label mid">1 mjesec</text>
  <text x="208" y="246" text-anchor="middle" class="label small">osnovna slika</text>

  <rect x="318" y="432" width="248" height="104" rx="10" class="soft"/>
  <text x="442" y="472" text-anchor="middle" class="label mid">3 mjeseca</text>
  <text x="442" y="504" text-anchor="middle" class="label small">obrasci</text>

  <rect x="552" y="174" width="248" height="104" rx="10" class="box"/>
  <text x="676" y="214" text-anchor="middle" class="label mid">180 dana</text>
  <text x="676" y="246" text-anchor="middle" class="label small">stvarni višak</text>

  <rect x="814" y="432" width="248" height="104" rx="10" class="soft"/>
  <text x="938" y="472" text-anchor="middle" class="label mid">1 godina</text>
  <text x="938" y="504" text-anchor="middle" class="label small">sezonski troškovi</text>
</svg>
