<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Prag jedne šezdesetine</title>
  <desc id="desc">Shema prikazuje kako se prag jedne šezdesetine neto imovine koristi kao filter za veće odluke.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 32px; font-weight: 750; }
      .h { font-size: 24px; font-weight: 750; }
      .m { font-size: 20px; font-weight: 650; }
      .s { font-size: 17px; }
      .box { fill: #fff; stroke: #333; stroke-width: 2.4; rx: 8; }
      .panel { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .accent { fill: #fff2e2; stroke: #f7931a; stroke-width: 3; rx: 8; }
      .cool { fill: #eef5ef; stroke: #4d8b68; stroke-width: 2.4; rx: 8; }
      .line { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#fff"/>
  <text x="600" y="58" text-anchor="middle" class="txt title">Prag jedne šezdesetine</text>

  <rect x="86" y="112" width="1028" height="148" class="accent"/>
  <text x="600" y="162" text-anchor="middle" class="txt h">neto imovina / 60</text>
  <text x="600" y="210" text-anchor="middle" class="txt s">Nije sveta brojka. To je obrazovni filter za odluke koje traže hladniju provjeru.</text>

  <rect x="126" y="310" width="280" height="120" class="panel"/>
  <text x="266" y="354" text-anchor="middle" class="txt h">60.000 EUR</text>
  <text x="266" y="395" text-anchor="middle" class="txt m">prag 1.000 EUR</text>
  <rect x="460" y="310" width="280" height="120" class="panel"/>
  <text x="600" y="354" text-anchor="middle" class="txt h">120.000 EUR</text>
  <text x="600" y="395" text-anchor="middle" class="txt m">prag 2.000 EUR</text>
  <rect x="794" y="310" width="280" height="120" class="panel"/>
  <text x="934" y="354" text-anchor="middle" class="txt h">600.000 EUR</text>
  <text x="934" y="395" text-anchor="middle" class="txt m">prag 10.000 EUR</text>

  <line x1="600" y1="260" x2="600" y2="292" class="line arrow"/>
  <line x1="600" y1="430" x2="600" y2="462" class="line arrow"/>

  <rect x="110" y="484" width="430" height="86" class="cool"/>
  <text x="325" y="518" text-anchor="middle" class="txt m">Manja odluka</text>
  <text x="325" y="548" text-anchor="middle" class="txt s">prolazi kroz običan proračun</text>

  <rect x="660" y="484" width="430" height="86" class="box"/>
  <text x="875" y="518" text-anchor="middle" class="txt m">Veća odluka</text>
  <text x="875" y="548" text-anchor="middle" class="txt s">trend, dug, davanje, ravnoteža, sigurnost i obitelj</text>

  <text x="600" y="618" text-anchor="middle" class="txt s">Model se koristi za ozbiljne odluke, ne za svaku kupnju.</text>
</svg>
