<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Starost novca i cijena odluke</title>
  <desc id="desc">Vremenska crta uspoređuje svježu plaću, novac koji je pričekao nekoliko tjedana i stariji novac koji je preživio obveze, impulse i promjene plana.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .mid { font-size: 22px; font-weight: 650; }
      .small { font-size: 18px; }
      .tiny { font-size: 16px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #B9B9B4; stroke-width: 2; }
      .line { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tick { stroke: #333333; stroke-width: 2; }
      .fade { fill: #EFEFED; stroke: #8A8A84; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="62" text-anchor="middle" class="label title">Starost novca i cijena odluke</text>
  <text x="600" y="101" text-anchor="middle" class="label small">Starost novca mjeri se u danima, ali poanta je smjer: više udaljenosti od impulsa.</text>

  <path d="M 134 338 L 1068 338" class="line"/>
  <line x1="214" y1="310" x2="214" y2="372" class="tick"/>
  <line x1="586" y1="310" x2="586" y2="372" class="tick"/>
  <line x1="930" y1="310" x2="930" y2="372" class="tick"/>

  <rect x="98" y="156" width="232" height="106" rx="10" class="box"/>
  <text x="214" y="197" text-anchor="middle" class="label mid">0 dana</text>
  <text x="214" y="229" text-anchor="middle" class="label small">svježa plaća</text>
  <text x="214" y="410" text-anchor="middle" class="label tiny">najbliže impulsu</text>

  <rect x="450" y="150" width="272" height="118" rx="10" class="soft"/>
  <text x="586" y="194" text-anchor="middle" class="label mid">nekoliko tjedana</text>
  <text x="586" y="226" text-anchor="middle" class="label small">obveze su se pokazale</text>
  <text x="586" y="410" text-anchor="middle" class="label tiny">više stvarnosti</text>

  <rect x="790" y="138" width="280" height="142" rx="10" class="fade"/>
  <text x="930" y="184" text-anchor="middle" class="label mid">60-90 dana</text>
  <text x="930" y="216" text-anchor="middle" class="label small">novac je preživio</text>
  <text x="930" y="244" text-anchor="middle" class="label small">promjene plana</text>
  <text x="930" y="410" text-anchor="middle" class="label tiny">mirnija odluka</text>

  <rect x="185" y="500" width="830" height="82" rx="10" class="soft"/>
  <text x="600" y="532" text-anchor="middle" class="label small">Obveze, impulsi i promjene plana filtriraju novac kroz vrijeme.</text>
  <text x="600" y="562" text-anchor="middle" class="label small">Stariji novac nije automatski slobodan, ali odluka iz njega obično je jasnija.</text>
</svg>
