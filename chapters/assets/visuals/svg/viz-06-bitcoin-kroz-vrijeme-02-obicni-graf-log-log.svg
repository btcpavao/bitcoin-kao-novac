<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Obični graf skriva, log-log graf ravna</title>
  <desc id="desc">Dva grafa uspoređuju običnu skalu na kojoj rani podaci nestaju i log-log skalu na kojoj se vidi dugoročniji odnos.</desc>
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 29px; font-weight: 750; }
      .h { font-size: 23px; font-weight: 700; }
      .s { font-size: 16px; }
      .panel { fill: #f7f7f4; stroke: #c9c9c3; stroke-width: 2; rx: 8; }
      .axis { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; }
      .grid { stroke: #deded8; stroke-width: 1.5; }
      .trend { stroke: #f7931a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .price { stroke: #333; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { fill: #fff; stroke: #8d8d86; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="58" text-anchor="middle" class="txt title">Obični graf skriva, log-log graf ravna</text>

  <rect x="64" y="105" width="510" height="420" class="panel"/>
  <rect x="626" y="105" width="510" height="420" class="panel"/>
  <text x="319" y="148" text-anchor="middle" class="txt h">Obična skala</text>
  <text x="881" y="148" text-anchor="middle" class="txt h">Log-log skala</text>

  <g transform="translate(112 190)">
    <line x1="0" y1="270" x2="390" y2="270" class="axis"/>
    <line x1="0" y1="270" x2="0" y2="0" class="axis"/>
    <path d="M 0 267 C 90 266, 150 262, 215 246 C 270 225, 335 160, 390 20" class="price"/>
    <text x="200" y="306" text-anchor="middle" class="txt s">vrijeme</text>
    <text x="-28" y="132" text-anchor="middle" transform="rotate(-90 -28 132)" class="txt s">cijena</text>
    <rect x="35" y="208" width="175" height="42" class="note"/>
    <text x="122" y="234" text-anchor="middle" class="txt s">rani podaci nestaju</text>
  </g>

  <g transform="translate(674 190)">
    <line x1="0" y1="270" x2="390" y2="270" class="axis"/>
    <line x1="0" y1="270" x2="0" y2="0" class="axis"/>
    <line x1="0" y1="210" x2="390" y2="210" class="grid"/>
    <line x1="0" y1="150" x2="390" y2="150" class="grid"/>
    <line x1="0" y1="90" x2="390" y2="90" class="grid"/>
    <line x1="90" y1="0" x2="90" y2="270" class="grid"/>
    <line x1="190" y1="0" x2="190" y2="270" class="grid"/>
    <line x1="290" y1="0" x2="290" y2="270" class="grid"/>
    <path d="M 25 228 L 365 52" class="trend"/>
    <path d="M 25 238 L 62 210 L 98 222 L 135 184 L 170 198 L 205 146 L 240 166 L 278 108 L 315 128 L 365 68" class="price"/>
    <text x="200" y="306" text-anchor="middle" class="txt s">log(vrijeme)</text>
    <text x="-34" y="132" text-anchor="middle" transform="rotate(-90 -34 132)" class="txt s">log(cijena)</text>
    <text x="270" y="76" class="txt s">trend</text>
    <text x="92" y="184" class="txt s">odmaci</text>
  </g>

  <text x="600" y="585" text-anchor="middle" class="txt s">Log skala pomaže vidjeti odnos. Ne dokazuje budućnost.</text>
</svg>
