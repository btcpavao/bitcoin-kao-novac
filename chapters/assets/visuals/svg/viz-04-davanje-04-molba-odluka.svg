<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Davanje nije svaka molba</title>
  <desc id="desc">Tok odluke prikazuje da molba može voditi prema davanju, drukčijem obliku pomoći ili poštenom odbijanju.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .small { font-size: 16px; }
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .soft { fill: #F7F7F5; stroke: #C9C9C3; stroke-width: 2; }
      .line { stroke: #333333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Davanje nije pristajanje na svaku molbu</text>

  <rect x="486" y="122" width="228" height="78" rx="16" class="box"/>
  <text x="600" y="171" text-anchor="middle" class="label head">Molba</text>

  <rect x="164" y="266" width="236" height="112" rx="16" class="soft"/>
  <text x="282" y="305" text-anchor="middle" class="label head">Stvarna potreba?</text>
  <text x="282" y="341" text-anchor="middle" class="label small">možeš dati</text>
  <text x="282" y="365" text-anchor="middle" class="label small">bez rušenja reda</text>

  <rect x="482" y="266" width="236" height="112" rx="16" class="soft"/>
  <text x="600" y="305" text-anchor="middle" class="label head">Bolji oblik?</text>
  <text x="600" y="341" text-anchor="middle" class="label small">račun, hrana, dar</text>
  <text x="600" y="365" text-anchor="middle" class="label small">posao, proračun</text>

  <rect x="800" y="266" width="236" height="112" rx="16" class="soft"/>
  <text x="918" y="305" text-anchor="middle" class="label head">Hrani nered?</text>
  <text x="918" y="341" text-anchor="middle" class="label small">pritisak, skrivanje</text>
  <text x="918" y="365" text-anchor="middle" class="label small">stalni isti obrazac</text>

  <path d="M 540 200 C 430 230 335 244 282 266" class="line"/>
  <path d="M 600 200 L 600 256" class="line"/>
  <path d="M 660 200 C 770 230 865 244 918 266" class="line"/>

  <rect x="164" y="462" width="236" height="86" rx="16" class="box"/>
  <text x="282" y="514" text-anchor="middle" class="label head">Dati</text>
  <rect x="482" y="462" width="236" height="86" rx="16" class="box"/>
  <text x="600" y="514" text-anchor="middle" class="label head">Dati drukčije</text>
  <rect x="800" y="462" width="236" height="86" rx="16" class="box"/>
  <text x="918" y="514" text-anchor="middle" class="label head">Reći ne</text>

  <path d="M 282 378 L 282 452" class="line"/>
  <path d="M 600 378 L 600 452" class="line"/>
  <path d="M 918 378 L 918 452" class="line"/>

  <text x="600" y="615" text-anchor="middle" class="label small">Granica ne služi hladnoći. Služi tome da pomoć bude stvarna.</text>
</svg>
