<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Redoslijed: proračun, dug, davanje</title>
  <desc id="desc">Stepenice prikazuju redoslijed proračuna, izlaska iz duga, davanja, ravnoteže imovine i Bitcoina kao dominantnog novca.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 30px; font-weight: 700; }
      .step { fill: #FFFFFF; stroke: #333333; stroke-width: 2.5; }
      .soft { fill: #F7F7F5; stroke: #C9C9C3; stroke-width: 2; }
      .head { font-size: 22px; font-weight: 700; }
      .small { font-size: 16px; }
      .note { font-size: 15px; fill: #555555; }
      .line { stroke: #333333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Redoslijed čuva davanje od improvizacije</text>
  <rect x="86" y="120" width="1028" height="430" rx="24" class="soft"/>

  <g>
    <rect x="146" y="390" width="178" height="88" rx="14" class="step"/>
    <text x="235" y="424" text-anchor="middle" class="label head">Proračun</text>
    <text x="235" y="454" text-anchor="middle" class="label small">što postoji</text>
  </g>
  <g>
    <rect x="338" y="330" width="178" height="88" rx="14" class="step"/>
    <text x="427" y="364" text-anchor="middle" class="label head">Dug van</text>
    <text x="427" y="394" text-anchor="middle" class="label small">što nije slobodno</text>
  </g>
  <g>
    <rect x="530" y="270" width="178" height="88" rx="14" class="step"/>
    <text x="619" y="304" text-anchor="middle" class="label head">Davanje</text>
    <text x="619" y="334" text-anchor="middle" class="label small">što ide drugima</text>
  </g>
  <g>
    <rect x="722" y="210" width="178" height="88" rx="14" class="step"/>
    <text x="811" y="244" text-anchor="middle" class="label head">Ravnoteža</text>
    <text x="811" y="274" text-anchor="middle" class="label small">cijela imovina</text>
  </g>
  <g>
    <rect x="914" y="150" width="178" height="88" rx="14" class="step"/>
    <text x="1003" y="184" text-anchor="middle" class="label head">Bitcoin</text>
    <text x="1003" y="214" text-anchor="middle" class="label small">dominantan novac</text>
  </g>

  <path d="M 324 420 L 338 390" class="line"/>
  <path d="M 516 360 L 530 330" class="line"/>
  <path d="M 708 300 L 722 270" class="line"/>
  <path d="M 900 240 L 914 210" class="line"/>

  <rect x="408" y="492" width="384" height="42" rx="10" fill="#FFFFFF" stroke="#8D8D86" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" class="label note">Sustavno davanje počinje tek nakon nula duga.</text>
</svg>
