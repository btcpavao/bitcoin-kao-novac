<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Saldo nije slobodan novac</title>
  <desc id="desc">Dijagram prikazuje kako se saldo od 2.300 eura raspoređuje u kategorije proračuna.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A3A"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222222; }
      .title { font-size: 28px; font-weight: 700; }
      .amount { font-size: 52px; font-weight: 750; }
      .small { font-size: 18px; }
      .mid { font-size: 22px; font-weight: 650; }
      .box { fill: #FFFFFF; stroke: #3A3A3A; stroke-width: 2.5; }
      .soft { fill: #F6F6F3; stroke: #C9C9C3; stroke-width: 2; }
      .track { fill: #FFFFFF; stroke: #9A9A93; stroke-width: 1.6; }
      .bar { fill: #EFEFED; stroke: none; }
      .accent { fill: #F7931A; stroke: #9B5A10; stroke-width: 1.6; }
      .line { stroke: #3A3A3A; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="label title">Saldo nije slobodan novac</text>

  <rect x="88" y="158" width="318" height="256" rx="22" class="box"/>
  <text x="247" y="233" text-anchor="middle" class="label mid">Tekući račun</text>
  <text x="247" y="306" text-anchor="middle" class="label amount">2.300 €</text>
  <text x="247" y="358" text-anchor="middle" class="label small">lokacija novca</text>

  <path d="M 430 286 L 532 286" class="line"/>

  <rect x="560" y="112" width="552" height="486" rx="22" class="soft"/>
  <text x="836" y="157" text-anchor="middle" class="label mid">Kategorije pokazuju zadatak</text>

  <g class="label small">
    <rect x="612" y="197" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="197" width="338" height="34" rx="8" class="bar"/>
    <text x="636" y="220">stanovanje</text>
    <text x="1032" y="220" text-anchor="end">700 €</text>

    <rect x="612" y="247" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="247" width="151" height="34" rx="8" class="bar"/>
    <text x="636" y="270">režije</text>
    <text x="1032" y="270" text-anchor="end">250 €</text>

    <rect x="612" y="297" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="297" width="240" height="34" rx="8" class="bar"/>
    <text x="636" y="320">hrana</text>
    <text x="1032" y="320" text-anchor="end">420 €</text>

    <rect x="612" y="347" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="347" width="103" height="34" rx="8" class="bar"/>
    <text x="636" y="370">prijevoz</text>
    <text x="1032" y="370" text-anchor="end">180 €</text>

    <rect x="612" y="397" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="397" width="114" height="34" rx="8" class="accent"/>
    <text x="636" y="420">dug</text>
    <text x="1032" y="420" text-anchor="end">200 €</text>

    <rect x="612" y="447" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="447" width="57" height="34" rx="8" class="bar"/>
    <text x="636" y="470">davanje</text>
    <text x="1032" y="470" text-anchor="end">100 €</text>

    <rect x="612" y="497" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="497" width="103" height="34" rx="8" class="bar"/>
    <text x="636" y="520">budući troškovi</text>
    <text x="1032" y="520" text-anchor="end">180 €</text>

    <rect x="612" y="547" width="338" height="34" rx="8" class="track"/>
    <rect x="612" y="547" width="69" height="34" rx="8" class="bar"/>
    <text x="636" y="570">slobodna potrošnja</text>
    <text x="1032" y="570" text-anchor="end">120 €</text>
  </g>
</svg>
